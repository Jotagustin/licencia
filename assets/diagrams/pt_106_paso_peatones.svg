<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Automóvil aproximándose a un paso de cebra mientras un peatón cruza la calzada">
  <rect width="560" height="320" rx="16" fill="#e2e8f0"/>
  <!-- Sidewalks -->
  <rect x="0" y="0" width="95" height="320" fill="#cbd5e1"/>
  <rect x="465" y="0" width="95" height="320" fill="#cbd5e1"/>
  <!-- Road -->
  <rect x="95" y="0" width="370" height="320" fill="#475569"/>
  <rect x="95" y="0" width="6" height="320" fill="#facc15"/>
  <rect x="459" y="0" width="6" height="320" fill="#facc15"/>
  <!-- Center dashed line -->
  <line x1="280" y1="0" x2="280" y2="85" stroke="#ffffff" stroke-width="4" stroke-dasharray="16 14"/>
  <line x1="280" y1="190" x2="280" y2="320" stroke="#ffffff" stroke-width="4" stroke-dasharray="16 14"/>
  <!-- Zebra crosswalk -->
  <g fill="#ffffff">
    <rect x="115" y="102" width="26" height="68" rx="2"/>
    <rect x="155" y="102" width="26" height="68" rx="2"/>
    <rect x="195" y="102" width="26" height="68" rx="2"/>
    <rect x="235" y="102" width="26" height="68" rx="2"/>
    <rect x="275" y="102" width="26" height="68" rx="2"/>
    <rect x="315" y="102" width="26" height="68" rx="2"/>
    <rect x="355" y="102" width="26" height="68" rx="2"/>
    <rect x="395" y="102" width="26" height="68" rx="2"/>
  </g>
  <!-- Stop line -->
  <rect x="284" y="184" width="168" height="6" fill="#ffffff"/>
  <!-- Pedestrian crossing from right to left -->
  <g transform="translate(345, 118)">
    <circle cx="16" cy="14" r="10" fill="#fed7aa" stroke="#1e293b" stroke-width="2"/>
    <rect x="6" y="25" width="20" height="18" rx="6" fill="#f97316"/>
    <line x1="12" y1="43" x2="6" y2="56" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="43" x2="27" y2="56" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- Direction arrow for pedestrian -->
    <path d="M -8 24 L -32 24" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-40,24 -28,18 -28,30" fill="#fde047"/>
  </g>
  <!-- Approaching blue car from bottom -->
  <g transform="translate(332, 206)">
    <rect x="0" y="0" width="64" height="102" rx="13" fill="#2563eb" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="8" y="18" width="48" height="22" rx="5" fill="#bae6fd"/>
    <rect x="10" y="46" width="44" height="30" rx="4" fill="#1d4ed8"/>
    <rect x="8" y="4" width="12" height="5" rx="2" fill="#fef08a"/>
    <rect x="44" y="4" width="12" height="5" rx="2" fill="#fef08a"/>
    <rect x="8" y="93" width="12" height="5" rx="2" fill="#ef4444"/>
    <rect x="44" y="93" width="12" height="5" rx="2" fill="#ef4444"/>
  </g>
</svg>
