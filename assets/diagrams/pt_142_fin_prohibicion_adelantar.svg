<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-label="Señal reglamentaria de fin de prohibición de adelantar">
  <rect width="360" height="320" rx="16" fill="#e8eff6"/>
  <rect x="172" y="210" width="16" height="110" fill="#64748b"/>
  <!-- Outer regulatory sign disc -->
  <circle cx="180" cy="145" r="108" fill="#ffffff" stroke="#1e293b" stroke-width="6"/>
  <circle cx="180" cy="145" r="97" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Greyed-out left passing car & right car silhouettes -->
  <g fill="#475569" opacity="0.72">
    <!-- Left car -->
    <rect x="112" y="118" width="54" height="58" rx="9"/>
    <rect x="120" y="106" width="38" height="22" rx="6"/>
    <rect x="116" y="172" width="12" height="12" rx="2"/>
    <rect x="150" y="172" width="12" height="12" rx="2"/>
    <!-- Right car -->
    <rect x="194" y="118" width="54" height="58" rx="9"/>
    <rect x="202" y="106" width="38" height="22" rx="6"/>
    <rect x="198" y="172" width="12" height="12" rx="2"/>
    <rect x="232" y="172" width="12" height="12" rx="2"/>
  </g>
  <!-- Diagonal end-of-restriction black slash bars -->
  <line x1="112" y1="213" x2="248" y2="77" stroke="#0f172a" stroke-width="18" stroke-linecap="butt"/>
  <line x1="112" y1="213" x2="248" y2="77" stroke="#ffffff" stroke-width="3" stroke-dasharray="1 1"/>
</svg>
