<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-label="Automóvil que pretende virar a la derecha cruzando una ciclovía por donde se aproxima un ciclista">
  <rect width="560" height="340" rx="16" fill="#dcfce7"/>
  <!-- Road base -->
  <rect x="110" y="0" width="290" height="340" fill="#475569"/>
  <rect x="110" y="75" width="450" height="145" fill="#475569"/>
  <!-- Bike lane (ciclovía) on right edge going straight up -->
  <rect x="336" y="0" width="60" height="340" fill="#15803d"/>
  <line x1="336" y1="0" x2="336" y2="340" stroke="#ffffff" stroke-width="4"/>
  <!-- Bike lane markings -->
  <polygon points="366,24 356,44 376,44" fill="#ffffff"/>
  <text x="366" y="156" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" opacity="0.9">CICLOVÍA</text>
  <!-- Center dashed line -->
  <line x1="222" y1="0" x2="222" y2="75" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="12 10"/>
  <line x1="222" y1="220" x2="222" y2="340" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="12 10"/>
  <!-- Blue car intending to turn right -->
  <g transform="translate(245, 210)">
    <rect x="0" y="0" width="62" height="106" rx="13" fill="#2563eb" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="8" y="20" width="46" height="22" rx="5" fill="#bae6fd"/>
    <rect x="10" y="48" width="42" height="30" rx="4" fill="#1d4ed8"/>
    <!-- Blinking right turn indicator -->
    <circle cx="58" cy="8" r="6" fill="#f97316"/>
    <circle cx="58" cy="98" r="5" fill="#f97316"/>
  </g>
  <!-- Intended turn path across bike lane -->
  <path d="M 276 202 C 276 142, 330 132, 430 132" fill="none" stroke="#fde047" stroke-width="4" stroke-dasharray="9 7"/>
  <polygon points="444,132 426,123 426,141" fill="#fde047"/>
  <!-- Cyclist approaching straight ahead on bike lane -->
  <g transform="translate(352, 232)">
    <rect x="10" y="0" width="6" height="44" rx="3" fill="#0f172a"/>
    <line x1="2" y1="10" x2="24" y2="10" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="13" cy="22" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <path d="M 13 -6 L 13 -32" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="13,-44 5,-28 21,-28" fill="#ffffff"/>
  </g>
</svg>
